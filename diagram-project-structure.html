<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TINHTUTE Skills · Repository Structure</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · Repository Structure</p>
    <h1>TINHTUTE Skills</h1>

    <svg viewBox="0 0 1080 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Tier labels -->
      <text x="40" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 0 · ROOT</text>
      <text x="40" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="start">TIER 1</text>
      <text x="40" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="start">TIER 2</text>

      <!-- Connectors drawn first (behind nodes) -->
      <!-- Root → Tier 1 bus -->
      <path d="M 540 128 L 540 168 L 120 168 L 120 208" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 540 168 L 330 168 L 330 208" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 540 168 L 540 208" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 540 168 L 750 168 L 750 208" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 540 168 L 960 168 L 960 208" fill="none" stroke="#4f5d75" stroke-width="1"/>

      <!-- scripts/ → leaves -->
      <path d="M 750 256 L 750 296 L 670 296 L 670 336" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 750 296 L 830 296 L 830 336" fill="none" stroke="#4f5d75" stroke-width="1"/>

      <!-- Root node -->
      <rect x="440" y="80" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="80" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="448" y="88" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="464" y="97" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPO</text>
      <text x="540" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TINHTUTE Skills</text>

      <!-- Tier 1: skills/ -->
      <rect x="40" y="208" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="208" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="216" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="62" y="225" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DIR</text>
      <text x="120" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">skills/</text>
      <text x="120" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">13 agent skills</text>

      <!-- Tier 1: rules/ -->
      <rect x="250" y="208" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="250" y="208" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="258" y="216" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="272" y="225" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DIR</text>
      <text x="330" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">rules/</text>
      <text x="330" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">english.md</text>

      <!-- Tier 1: setup/ -->
      <rect x="460" y="208" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="460" y="208" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="468" y="216" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="482" y="225" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DIR</text>
      <text x="540" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">setup/</text>
      <text x="540" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">settings.json</text>

      <!-- Tier 1: scripts/ -->
      <rect x="670" y="208" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="670" y="208" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="678" y="216" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="692" y="225" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DIR</text>
      <text x="750" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">scripts/</text>
      <text x="750" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2 shell scripts</text>

      <!-- Tier 1: docs/ -->
      <rect x="880" y="208" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="208" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="888" y="216" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="902" y="225" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DIR</text>
      <text x="960" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">docs/</text>
      <text x="960" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">README + CLAUDE.md</text>

      <!-- Tier 2: setup-statusline.sh (focal) -->
      <rect x="590" y="336" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="590" y="336" width="160" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="598" y="344" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="618" y="353" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCRIPT</text>
      <text x="670" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Statusline Install</text>
      <text x="670" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">curl | bash</text>

      <!-- Tier 2: sync-from-kit.sh -->
      <rect x="750" y="336" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="750" y="336" width="160" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="758" y="344" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="778" y="353" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCRIPT</text>
      <text x="830" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">sync-from-kit.sh</text>
      <text x="830" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">incubator sync</text>

      <!-- Legend strip -->
      <line x1="40" y1="412" x2="1040" y2="412" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="444" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="452" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Directory</text>

      <rect x="180" y="444" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="200" y="452" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Script</text>

      <rect x="320" y="444" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="340" y="452" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Statusline Install</text>
    </svg>
  </div>
</body>
</html>
