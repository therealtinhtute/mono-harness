<svg width="960" height="780" viewBox="0 0 960 780" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
    </marker>
    <style>
      .title { font: 400 28px 'Instrument Serif', Georgia, serif; fill: #1c1917; }
      .label { font: 600 12px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #1c1917; }
      .mono { font: 500 9px 'SFMono-Regular', Consolas, monospace; fill: #57534e; }
      .arrowLabel { font: 500 8px 'SFMono-Regular', Consolas, monospace; fill: #57534e; letter-spacing: 0.08em; }
      .legend { font: 500 8px 'SFMono-Regular', Consolas, monospace; fill: #57534e; letter-spacing: 0.14em; }
    </style>
  </defs>

  <rect width="960" height="780" fill="#faf7f2"/>
  <rect width="960" height="780" fill="url(#dots)" opacity="0.55"/>

  <text x="72" y="68" class="title">How `brainstorm` + `plan` + `cook` fit with the rest of the repo</text>

  <rect x="388" y="96" width="184" height="44" rx="22" fill="#faf7f2"/>
  <rect x="388" y="96" width="184" height="44" rx="22" fill="#f2ede4" stroke="#78716c" stroke-width="1"/>
  <text x="480" y="122" class="label" text-anchor="middle">Idea / files / feature</text>

  <path d="M480 140 L480 180" stroke="#b5523a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <rect x="320" y="180" width="320" height="84" rx="8" fill="#faf7f2"/>
  <rect x="320" y="180" width="320" height="84" rx="8" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1.2"/>
  <rect x="336" y="194" width="68" height="14" rx="3" fill="transparent" stroke="rgba(181,82,58,0.40)" stroke-width="0.8"/>
  <text x="370" y="204" class="legend" text-anchor="middle">BRAINSTORM</text>
  <text x="480" y="224" class="label" text-anchor="middle">`brainstorm`</text>
  <text x="480" y="244" class="mono" text-anchor="middle">explore options • lock WHAT into `.kit/planning/SPEC.md`</text>

  <path d="M480 264 L480 304" stroke="#b5523a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="494" y="276" width="46" height="14" rx="3" fill="#faf7f2"/>
  <text x="517" y="286" class="arrowLabel" text-anchor="middle">SPEC</text>

  <rect x="320" y="304" width="320" height="84" rx="8" fill="#faf7f2"/>
  <rect x="320" y="304" width="320" height="84" rx="8" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1.2"/>
  <rect x="336" y="318" width="40" height="14" rx="3" fill="transparent" stroke="rgba(181,82,58,0.40)" stroke-width="0.8"/>
  <text x="356" y="328" class="legend" text-anchor="middle">PLAN</text>
  <text x="480" y="348" class="label" text-anchor="middle">`plan`</text>
  <text x="480" y="368" class="mono" text-anchor="middle">writes `ROADMAP.md` + phase `CONTEXT.md` + phase `PLAN.md`</text>

  <path d="M480 388 L480 428" stroke="#b5523a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="486" y="400" width="62" height="14" rx="3" fill="#faf7f2"/>
  <text x="517" y="410" class="arrowLabel" text-anchor="middle">PHASES</text>

  <rect x="320" y="428" width="320" height="84" rx="8" fill="#faf7f2"/>
  <rect x="320" y="428" width="320" height="84" rx="8" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1.2"/>
  <rect x="336" y="442" width="40" height="14" rx="3" fill="transparent" stroke="rgba(181,82,58,0.40)" stroke-width="0.8"/>
  <text x="356" y="452" class="legend" text-anchor="middle">COOK</text>
  <text x="480" y="472" class="label" text-anchor="middle">`cook`</text>
  <text x="480" y="492" class="mono" text-anchor="middle">runs waves • dispatches subagents • verifies per task</text>

  <path d="M480 512 L480 552" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="486" y="524" width="78" height="14" rx="3" fill="#faf7f2"/>
  <text x="525" y="534" class="arrowLabel" text-anchor="middle">PHASE DIFF</text>

  <rect x="340" y="552" width="280" height="72" rx="8" fill="#faf7f2"/>
  <rect x="340" y="552" width="280" height="72" rx="8" fill="rgba(28,25,23,0.04)" stroke="#1c1917" stroke-width="1"/>
  <rect x="356" y="566" width="44" height="14" rx="3" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="378" y="576" class="legend" text-anchor="middle">CHECK</text>
  <text x="480" y="596" class="label" text-anchor="middle">`check`</text>
  <text x="480" y="614" class="mono" text-anchor="middle">tests • lint • build • security • architecture • quality</text>

  <path d="M480 624 L480 664" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="492" y="636" width="50" height="14" rx="3" fill="#faf7f2"/>
  <text x="517" y="646" class="arrowLabel" text-anchor="middle">CLEAN</text>

  <rect x="200" y="664" width="180" height="56" rx="8" fill="#f2ede4" stroke="#78716c" stroke-width="1"/>
  <text x="290" y="688" class="label" text-anchor="middle">`git`</text>
  <text x="290" y="706" class="mono" text-anchor="middle">commit • push • PR</text>

  <rect x="390" y="664" width="180" height="56" rx="8" fill="#f2ede4" stroke="#78716c" stroke-width="1"/>
  <text x="480" y="688" class="label" text-anchor="middle">`watzup`</text>
  <text x="480" y="706" class="mono" text-anchor="middle">retro • risks • PR readiness</text>

  <rect x="580" y="664" width="180" height="56" rx="8" fill="#f2ede4" stroke="#78716c" stroke-width="1"/>
  <text x="670" y="688" class="label" text-anchor="middle">`handoff`</text>
  <text x="670" y="706" class="mono" text-anchor="middle">save state • resume next</text>

  <line x1="72" y1="752" x2="888" y2="752" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
  <text x="72" y="768" class="legend">FLOW: BRAINSTORM → PLAN → COOK → CHECK → GIT / WATZUP / HANDOFF</text>
</svg>
