# Workflow State Manifest Template

Use this for `.kit/workflow-state.yml`. Keep it tiny and pointer-only.

```yaml
current_phase: {phase-slug | none}
entry_phase: {phase-slug | none}
spec: .planning/SPEC.md
roadmap: .planning/ROADMAP.md
active_context: .planning/phases/{phase-slug}/{phase-slug}-CONTEXT.md | none
active_plan: .planning/phases/{phase-slug}/{phase-slug}-PLAN.md | none
latest_cook_run: none
latest_check_report: none
handoff: .kit/HANDOFF.md | none
last_updated: YYYY-MM-DD HH:mm
```

Rules:
- initialize in `plan` after roadmap + phase artifacts exist
- update only pointers/status fields; do not duplicate roadmap, run-log, or report content
- overwrite in place; this file represents the latest canonical workflow position
- `current_phase` = the phase actively being executed or resumed
- `entry_phase` = the recommended next phase when execution has not started yet
