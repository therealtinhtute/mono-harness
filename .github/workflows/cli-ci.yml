name: cli-ci

on:
  push:
    branches: [master]
    paths:
      - "cli/**"
      - "docs/plans/**"
      - "docs/playbooks/**"
      - "docs/WORKFLOW.md"
      - "scripts/install-git-hooks.sh"
      - ".github/workflows/cli-ci.yml"
  pull_request:
    paths:
      - "cli/**"
      - "docs/plans/**"
      - "docs/playbooks/**"
      - "docs/WORKFLOW.md"
      - "scripts/install-git-hooks.sh"
      - ".github/workflows/cli-ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build (CGO disabled)
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  hook-guard:
    # R4: re-run the v0.15 fail-closed guards (R2 proof re-execution + R3
    # independent-judge rule) against pushed commits, so a local-hook bypass
    # cannot land an APPROVED validation entry whose proofs do not pass.
    runs-on: ubuntu-latest
    steps:
      # ADR 0009: the guard validates a range, not a single commit, so the
      # checkout must carry enough history to resolve that range's base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract guard core from installer
        run: |
          awk '$0=="# ZGUARD-CORE-BEGIN"{on=1;next} $0=="# ZGUARD-CORE-END"{on=0} on' scripts/install-git-hooks.sh > /tmp/guard.sh
          grep -q '^zharness_guard_entries_of_file()' /tmp/guard.sh
          grep -q '^zharness_guard_at_most_one_active_plan()' /tmp/guard.sh
          grep -q '^zharness_guard_completed_plan_phases_done()' /tmp/guard.sh
          grep -q '^zharness_guard_revspec()' /tmp/guard.sh
          grep -q '^zharness_guard_plan_paths()' /tmp/guard.sh

      - name: Guard fixture tests (guard-v3)
        run: bash scripts/test-guards.sh
      - name: At most one active plan
        run: |
          source /tmp/guard.sh
          zharness_guard_at_most_one_active_plan "$GITHUB_WORKSPACE"
      - name: Run guards against the pushed range's plan changes
        env:
          ZHARNESS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ZHARNESS_BEFORE_SHA: ${{ github.event.before }}
          ZHARNESS_BASE_REF: ${{ github.event.pull_request.base.sha }}
          ZHARNESS_DEFAULT_BRANCH: origin/${{ github.event.repository.default_branch }}
        run: |
          source /tmp/guard.sh
          event=push
          [ "${{ github.event_name }}" = "pull_request" ] && event=pr
          revspec=$(zharness_guard_revspec "$event") || exit 1
          gbase=$(printf '%s' "$revspec" | cut -f1)
          ghead=$(printf '%s' "$revspec" | cut -f2)
          echo "guarding range $gbase..$ghead"
          plans=$(zharness_guard_plan_paths "$gbase" "$ghead")
          if [ -z "$plans" ]; then echo "no plan changes in range"; exit 0; fi
          printf 'plans in range:\n%s\n' "$plans"
          failed=0
          tmpdir=$(mktemp -d)
          zhuards_guard_plans "$plans" "$gbase" "$ghead" "$tmpdir" || failed=1
          while IFS= read -r f; do
            case "$f" in docs/plans/completed/*) ;; *) continue ;; esac
            git show "$ghead:$f" > /tmp/completed.md
            zharness_guard_completed_plan_phases_done "$f" /tmp/completed.md || failed=1
          done <<< "$plans"
          exit $failed
