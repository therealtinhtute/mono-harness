name: cli-ci

on:
  push:
    branches: [master]
    paths:
      - "cli/**"
      - "docs/plans/**"
      - "docs/playbooks/**"
      - "docs/WORKFLOW.md"
      - "scripts/install-git-hooks.sh"
      - ".github/workflows/cli-ci.yml"
  pull_request:
    paths:
      - "cli/**"
      - "docs/plans/**"
      - "docs/playbooks/**"
      - "docs/WORKFLOW.md"
      - "scripts/install-git-hooks.sh"
      - ".github/workflows/cli-ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build
        run: cargo build

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  size-gate:
    # R8: the size target is a success signal, so it is enforced rather than
    # measured. The plan's target is <= 1,850,000 bytes for the stripped
    # darwin/arm64 build; linux/amd64 is the largest of the three release
    # targets, so it is the one that can fail first.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build the release binary for x86_64-unknown-linux-musl
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Fail if the stripped binary exceeds 1,850,000 bytes
        run: |
          size=$(wc -c < target/x86_64-unknown-linux-musl/release/zharness)
          echo "linux/amd64 stripped binary: $size bytes"
          test "$size" -le 1850000

  hook-guard:
    # R4: re-run the v0.15 fail-closed guards (R2 proof re-execution + R3
    # independent-judge rule) against pushed commits, so a local-hook bypass
    # cannot land an APPROVED validation entry whose proofs do not pass.
    runs-on: ubuntu-latest
    steps:
      # ADR 0009: the guard validates a range, not a single commit, so the
      # checkout must carry enough history to resolve that range's base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract guard core from installer
        run: |
          awk '$0=="# ZGUARD-CORE-BEGIN"{on=1;next} $0=="# ZGUARD-CORE-END"{on=0} on' scripts/install-git-hooks.sh > /tmp/guard.sh
          grep -q '^zharness_guard_entries_of_file()' /tmp/guard.sh
          grep -q '^zharness_guard_at_most_one_active_plan()' /tmp/guard.sh
          grep -q '^zharness_guard_completed_plan_phases_done()' /tmp/guard.sh
          grep -q '^zharness_guard_revspec()' /tmp/guard.sh
          grep -q '^zharness_guard_plan_paths()' /tmp/guard.sh

      - name: Guard fixture tests (guard-v3)
        run: bash scripts/test-guards.sh
      - name: At most one active plan
        run: |
          source /tmp/guard.sh
          zharness_guard_at_most_one_active_plan "$GITHUB_WORKSPACE"
      # A pull_request checkout has only origin/<default>; proofs may name the
      # default branch bare (`git show master:…`), so provide the local ref.
      - name: Provide the default branch ref for proofs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git rev-parse -q --verify "refs/heads/$DEFAULT_BRANCH" >/dev/null || git branch "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
      # The follow-ups plan's retained Validation entries cite two probe
      # scripts at /tmp and actionlint. Both are committed under
      # scripts/probes/ and provided here, so a fresh checkout can re-execute
      # those proofs unchanged instead of failing on a missing file or tool.
      - name: Provide the retained proofs' environment
        run: |
          cp scripts/probes/p2-nonvacuity.sh scripts/probes/p2gate-smoke.sh /tmp/
          chmod +x /tmp/p2-nonvacuity.sh /tmp/p2gate-smoke.sh
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run guards against the pushed range's plan changes
        env:
          ZHARNESS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ZHARNESS_BEFORE_SHA: ${{ github.event.before }}
          ZHARNESS_BASE_REF: ${{ github.event.pull_request.base.sha }}
          ZHARNESS_DEFAULT_BRANCH: origin/${{ github.event.repository.default_branch }}
        run: |
          source /tmp/guard.sh
          event=push
          [ "${{ github.event_name }}" = "pull_request" ] && event="pr"
          revspec=$(zharness_guard_revspec "$event") || exit 1
          gbase=$(printf '%s' "$revspec" | cut -f1)
          ghead=$(printf '%s' "$revspec" | cut -f2)
          echo "guarding range $gbase..$ghead"
          plans=$(zharness_guard_plan_paths "$gbase" "$ghead")
          if [ -z "$plans" ]; then echo "no plan changes in range"; exit 0; fi
          printf 'plans in range:\n%s\n' "$plans"
          failed=0
          tmpdir=$(mktemp -d)
          zhuards_guard_plans "$plans" "$gbase" "$ghead" "$tmpdir" || failed=1
          while IFS= read -r f; do
            case "$f" in docs/plans/completed/*) ;; *) continue ;; esac
            git show "$ghead:$f" > /tmp/completed.md
            zharness_guard_completed_plan_phases_done "$f" /tmp/completed.md || failed=1
          done <<< "$plans"
          exit $failed
