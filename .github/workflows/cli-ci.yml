name: cli-ci

on:
  push:
    branches: [master]
    paths:
      - "cli/**"
      - ".github/workflows/cli-ci.yml"
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/cli-ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build (CGO disabled)
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
